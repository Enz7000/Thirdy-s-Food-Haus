<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact - Thirdy's Restaurant</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a class="brand" href="index.html"><span>Thirdy's Restaurant</span></a>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="auth.html">Order Online</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>
<main class="section">
<h2>Contact Us</h2>
<form id="contactForm">
<div class="form-group"><label>Name</label><input id="cname" required><span class="error" id="ecname"></span></div>
<div class="form-group"><label>Email</label><input id="cemail" type="email" required><span class="error" id="ecemail"></span></div>
<div class="form-group"><label>Subject</label><input id="csubj" required></div>
<div class="form-group"><label>Message</label><textarea id="cmsg" required></textarea></div>
<button type="submit" class="btn primary">Send</button>
</form>
<div id="csuccess"></div>
<p>Phone: [editable placeholder]</p>
<p>Email: [editable placeholder]</p>
<p>Address: [editable placeholder]</p>
<p>Hours: [editable placeholder]</p>
</main>
<footer class="footer">
<div><h4>Thirdy's Restaurant</h4></div>
<div><a href="index.html">Home</a><a href="auth.html">Order Online</a><a href="about.html">About Us</a><a href="contact.html">Contact</a></div>
<div><p>[editable]</p></div>
</footer>
<script src="js/menu.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit',e=>{
 e.preventDefault();
 const name=document.getElementById('cname').value.trim();
 const email=document.getElementById('cemail').value.trim();
 let ok=true;
 document.getElementById('ecname').textContent=name?'':'Required';
 document.getElementById('ecemail').textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':'Invalid email';
 if(!name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) ok=false;
 if(ok){document.getElementById('csuccess').innerHTML='<div class="success">Message sent (simulated). Not delivered to real inbox.</div>';e.target.reset();}
});
</script>
</body>
</html>
